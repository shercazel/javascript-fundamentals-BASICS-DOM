<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>

<body>
    <p>Rock Paper Scissors</p>
    <button onclick="playGame('Rock'); ">Rock</button>
    <button onclick="playGame('Paper');">Paper</button>
    <button onclick="playGame('Scissors');">Scissors</button>
    <button onclick="resetScore();">Reset</button>
    <script>


        const storedScore = JSON.parse(localStorage.getItem('ScorePopUp'));
        const score = storedScore || {
            win: 0,
            lose: 0,
            draw: 0
        };


        function resetScore() {
            score.win = 0;
            score.lose = 0;
            score.draw = 0;
            return alert(`Youre Score was Reset Wins: ${score.win} -Losses: ${score.lose} -Draws: ${score.draw}`);
        }
        function playGame(playerMove) {
            let result = '';
            const computerPick = pickComputer();

            if (playerMove === 'Rock') {
                if (computerPick === 'Rock') {
                    result = 'Its a tie';
                } else if (computerPick === 'Paper') {
                    result = 'You lose';
                } else if (computerPick === 'Scissors') {
                    result = 'You win';
                }

            } else if (playerMove === 'Paper') {
                if (computerPick === 'Rock') {
                    result = 'You win';
                } else if (computerPick === 'Paper') {
                    result = 'Its a tie';
                }
                else if (computerPick === 'Scissors') {
                    result = 'You lose';
                }

            } else if (playerMove === 'Scissors') {

                if (computerPick === 'Rock') {
                    result = 'Its a tie';
                } else if (computerPick === 'Paper') {
                    result = 'You lose';
                } else if (computerPick === 'Scissors') {
                    result = 'You win';
                }
            }
            if (result === 'You win') {
                score.win++;
            }
            else if (result === 'You lose') {
                score.lose++;
            } else if (result === 'Its a tie') {
                score.draw++;
            }

            localStorage.setItem('ScorePopUp', JSON.stringify(score))

            return alert(`You pick ${playerMove} the Computer pick ${computerPick} the result is ${result}\nYour score is ${score.win} - ${score.lose} - ${score.draw}`);
        }
        function pickComputer() {
            let computerPick = '';
            const randomPick = Math.random();
            if (randomPick >= 0 && randomPick < 1 / 3) {
                computerPick = 'Rock';
            } else if (randomPick >= 1 / 3 && randomPick < 2 / 3) {
                computerPick = 'Paper'
            } else if (randomPick >= 2 / 3 && randomPick < 1) {
                computerPick = 'Scissors'
            }
            return computerPick;
        }
    </script>
</body>

</html>
