<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple To Do list App</title>

    <style>
        body {
            background-color: rgb(204, 235, 235);
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
            width: 100vw;
            height: auto;
        }

        .Main-Container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .Input-Text {
            border: 1px black;
            border-radius: 5px;
            box-shadow: 0px 0px 2px 2px rgba(1, 42, 68, 0.098);
            height: 30px;
            width: 245px;
            display: flex;
            justify-content: center;
            padding: 10px 2px;
            gap: 3px;
        }

        button {
            border: none;
            border-radius: 3px;
            background-color: rgb(3, 15, 182);
            color: white;
            transition: 0.3s all ease-in-out;


        }

        button:hover {
            background-color: white;
            color: rgb(76, 43, 226);
            transform: scale(1.02);
        }

        input {
            border: none;
            border-radius: 3px;
        }
    </style>

</head>

<body>
    <div class="Main-Container">
        <h1>My To-Do List</h1>
        <div class="Input-Text">
            <input type="text" name="taskInput" placeholder="input a new task!">

        </div>

</body>

</html>
